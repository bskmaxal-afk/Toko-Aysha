<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2FF"/>
      <stop offset="100%" stop-color="#E4D9FC"/>
    </linearGradient>
    <filter id="shadowCook" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradCook)"/>
  
  <g filter="url(#shadowCook)">
    <!-- Bumbu Paste Sachet (Indofood/Bamboe style) -->
    <rect x="90" y="80" width="90" height="135" rx="6" fill="#8B5CF6"/>
    <rect x="95" y="100" width="80" height="65" rx="4" fill="#FFFFFF"/>
    <text x="135" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#7C3AED" text-anchor="middle">BUMBU</text>
    <text x="135" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#B91C1C" text-anchor="middle">RENDANG</text>
    
    <!-- Indonesian Herbs & Spices -->
    <!-- Lemongrass stalks (Serai) -->
    <line x1="220" y1="230" x2="310" y2="80" stroke="#84CC16" stroke-width="8" stroke-linecap="round"/>
    <line x1="235" y1="235" x2="330" y2="95" stroke="#65A30D" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Kaffir lime leaves (Daun Jeruk) -->
    <ellipse cx="200" cy="185" rx="18" ry="10" fill="#15803D" transform="rotate(-30 200 185)"/>
    <ellipse cx="218" cy="175" rx="18" ry="10" fill="#16A34A" transform="rotate(20 218 175)"/>
    
    <!-- Red Bird's Eye Chili (Cabe Rawit) -->
    <path d="M225 210 Q265 210 275 190 Q255 195 225 210 Z" fill="#DC2626"/>
    <path d="M275 190 Q282 186 280 180" stroke="#15803D" stroke-width="2.5" fill="none"/>
    
    <!-- Candle nuts (Kemiri) -->
    <ellipse cx="170" cy="225" rx="12" ry="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <ellipse cx="192" cy="228" rx="11" ry="9" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
  </g>
  
  <!-- Badge -->
  <rect x="250" y="24" width="126" height="32" rx="16" fill="#7C3AED"/>
  <text x="313" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">HERBS & BUMBU</text>
</svg>
