<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8EE"/>
      <stop offset="100%" stop-color="#F2E6CD"/>
    </linearGradient>
    <filter id="shadowRice" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradRice)"/>
  
  <!-- Coconut in background -->
  <g filter="url(#shadowRice)" transform="translate(40, 20)">
    <!-- Rice Sacks and Coconut -->
    <circle cx="280" cy="180" r="50" fill="#6B3A19"/>
    <circle cx="280" cy="180" r="42" fill="#FFFFFF"/>
    <ellipse cx="280" cy="180" rx="30" ry="30" fill="#E8F4F8"/>
    
    <!-- Rice Sack -->
    <path d="M90 220 L110 110 Q160 95 210 110 L230 220 Q160 235 90 220 Z" fill="#E8D5B5" stroke="#C9B48F" stroke-width="3"/>
    <!-- Folded top -->
    <path d="M105 110 Q160 95 215 110 Q160 125 105 110 Z" fill="#F7EDE0" stroke="#C9B48F" stroke-width="2"/>
    <!-- White rice overflowing -->
    <ellipse cx="160" cy="108" rx="45" ry="12" fill="#FFFFFF"/>
    
    <!-- Rice grain details -->
    <ellipse cx="150" cy="106" rx="6" ry="2.5" fill="#EFEFEF" transform="rotate(20 150 106)"/>
    <ellipse cx="165" cy="109" rx="5" ry="2" fill="#EFEFEF" transform="rotate(-15 165 109)"/>
    <ellipse cx="178" cy="107" rx="6" ry="2.5" fill="#EFEFEF" transform="rotate(30 178 107)"/>
    
    <!-- Stamp on sack -->
    <rect x="130" y="140" width="60" height="40" rx="4" fill="none" stroke="#28523C" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="160" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#28523C" text-anchor="middle">BERAS</text>
  </g>
  
  <!-- Wheat / Rice stalk on side -->
  <path d="M70 250 Q60 160 100 80" stroke="#C77D2B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="98" cy="85" rx="10" ry="4" fill="#C77D2B" transform="rotate(-40 98 85)"/>
  <ellipse cx="88" cy="105" rx="10" ry="4" fill="#C77D2B" transform="rotate(30 88 105)"/>
  <ellipse cx="90" cy="130" rx="10" ry="4" fill="#C77D2B" transform="rotate(-35 90 130)"/>
  <ellipse cx="78" cy="155" rx="10" ry="4" fill="#C77D2B" transform="rotate(25 78 155)"/>
  
  <!-- Badge -->
  <rect x="250" y="24" width="126" height="32" rx="16" fill="#C77D2B"/>
  <text x="313" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PANTRY STAPLES</text>
</svg>
