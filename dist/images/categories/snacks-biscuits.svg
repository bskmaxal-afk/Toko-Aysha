<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSnacks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9EE"/>
      <stop offset="100%" stop-color="#FCE6C0"/>
    </linearGradient>
    <filter id="shadowSnacks" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradSnacks)"/>
  
  <g filter="url(#shadowSnacks)">
    <!-- Snack bag (Chitato / Keripik style) -->
    <path d="M120 70 L220 55 L245 220 L135 235 Z" fill="#E24E2B" rx="8"/>
    <!-- Top crimp -->
    <path d="M120 70 L220 55 L222 65 L122 80 Z" fill="#C03B1A"/>
    <!-- Bottom crimp -->
    <path d="M135 225 L243 210 L245 220 L135 235 Z" fill="#C03B1A"/>
    <!-- Snack bag label -->
    <ellipse cx="180" cy="140" rx="35" ry="25" fill="#FFFFFF" transform="rotate(-7 180 140)"/>
    <text x="180" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#E24E2B" text-anchor="middle" transform="rotate(-7 180 145)">CRISPY</text>
    
    <!-- Coconut Biscuit (Roma Kelapa style) -->
    <circle cx="260" cy="180" r="42" fill="#E8B568" stroke="#D19C48" stroke-width="3"/>
    <!-- Biscuit holes/pattern -->
    <circle cx="260" cy="160" r="3" fill="#B58133"/>
    <circle cx="260" cy="200" r="3" fill="#B58133"/>
    <circle cx="240" cy="180" r="3" fill="#B58133"/>
    <circle cx="280" cy="180" r="3" fill="#B58133"/>
    <circle cx="246" cy="166" r="3" fill="#B58133"/>
    <circle cx="274" cy="166" r="3" fill="#B58133"/>
    <circle cx="246" cy="194" r="3" fill="#B58133"/>
    <circle cx="274" cy="194" r="3" fill="#B58133"/>
    
    <!-- Prawn cracker (Kerupuk) -->
    <ellipse cx="95" cy="185" rx="35" ry="28" fill="#FFF4D4" stroke="#F0DCAC" stroke-width="2" transform="rotate(25 95 185)"/>
    <path d="M75 180 Q95 165 115 185" stroke="#F5D096" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Badge -->
  <rect x="250" y="24" width="126" height="32" rx="16" fill="#D97706"/>
  <text x="313" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">SNACKS & TREATS</text>
</svg>
