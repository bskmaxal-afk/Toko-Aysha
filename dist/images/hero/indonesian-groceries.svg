<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F7F3EA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EFE8D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.14"/>
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Backdrop circle -->
  <circle cx="300" cy="260" r="210" fill="url(#heroGlow)"/>
  
  <!-- Grocery Wooden / Cream Display Podium -->
  <ellipse cx="300" cy="380" rx="260" ry="60" fill="#E8DEC9" opacity="0.7"/>
  <ellipse cx="300" cy="375" rx="240" ry="50" fill="#F7F3EA"/>

  <g filter="url(#heroShadow)">
    <!-- 1. Rice Sack in the back-center -->
    <g transform="translate(200, 140)">
      <path d="M40 210 L60 80 Q105 60 150 80 L170 210 Q105 225 40 210 Z" fill="#E8D5B5" stroke="#C9B48F" stroke-width="3"/>
      <ellipse cx="105" cy="78" rx="46" ry="12" fill="#FFFFFF"/>
      <rect x="75" y="115" width="60" height="42" rx="4" fill="#28523C"/>
      <text x="105" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">BERAS</text>
      <text x="105" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#F7F3EA" text-anchor="middle">5 KG PANDAN</text>
    </g>

    <!-- 2. Bango Kecap Manis Bottle (Left-Center) -->
    <g transform="translate(140, 160)">
      <path d="M35 50 L55 50 L65 80 L70 190 L20 190 L25 80 Z" fill="#1C1817"/>
      <rect x="36" y="32" width="18" height="20" rx="3" fill="#28523C"/>
      <rect x="23" y="90" width="44" height="65" rx="4" fill="#28523C"/>
      <circle cx="45" cy="112" r="14" fill="#F7F3EA"/>
      <ellipse cx="43" cy="112" rx="5" ry="7" fill="#1C1817" transform="rotate(-15 43 112)"/>
      <ellipse cx="47" cy="112" rx="5" ry="7" fill="#1C1817" transform="rotate(15 47 112)"/>
      <text x="45" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">BANGO</text>
    </g>

    <!-- 3. ABC Sambal Extra Pedas Bottle (Left foreground) -->
    <g transform="translate(70, 200)">
      <path d="M30 45 L50 45 L60 75 L65 175 L15 175 L20 75 Z" fill="#DC2626"/>
      <rect x="31" y="28" width="18" height="18" rx="3" fill="#FBBF24"/>
      <rect x="18" y="85" width="44" height="55" rx="4" fill="#FFFFFF"/>
      <rect x="22" y="90" width="36" height="12" rx="2" fill="#DC2626"/>
      <text x="40" y="99" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">ABC</text>
      <text x="40" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#DC2626" text-anchor="middle">SAMBAL</text>
      <text x="40" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#1F2937" text-anchor="middle">EXTRA PEDAS</text>
    </g>

    <!-- 4. Indomie Mi Goreng Pack (Center Foreground) -->
    <g transform="translate(230, 240) rotate(-6)">
      <rect x="0" y="0" width="140" height="110" rx="10" fill="#F5F5F0" stroke="#E5E5E0" stroke-width="2"/>
      <!-- Indomie red banner top right -->
      <path d="M0 0 L140 0 L140 32 L0 32 Z" fill="#C7462B" rx="10 10 0 0"/>
      <circle cx="28" cy="16" r="12" fill="#047857"/>
      <text x="28" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">Indo</text>
      <text x="85" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">Mi goreng</text>
      <!-- Fried noodle illustration on packet -->
      <ellipse cx="70" cy="65" rx="50" ry="22" fill="#FFC107"/>
      <!-- Sunny side up fried egg on noodle -->
      <ellipse cx="68" cy="62" rx="18" ry="12" fill="#FFFFFF"/>
      <circle cx="68" cy="62" r="7" fill="#FF5722"/>
      <!-- Crispy shallots and chili garnish -->
      <circle cx="50" cy="68" r="2.5" fill="#C7462B"/>
      <circle cx="85" cy="64" r="2" fill="#C7462B"/>
      <circle cx="56" cy="74" r="2" fill="#28523C"/>
      <rect x="15" y="88" width="110" height="14" rx="3" fill="#C7462B"/>
      <text x="70" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">ORIGINAL FLAVOR • 85g</text>
    </g>

    <!-- 5. Teh Botol Sosro Carton (Right-Center) -->
    <g transform="translate(370, 180) rotate(5)">
      <path d="M20 30 L65 18 L76 150 L31 162 Z" fill="#E65100" rx="3"/>
      <path d="M20 30 L65 18 L53 6 L8 18 Z" fill="#EF6C00"/>
      <line x1="45" y1="12" x2="60" y2="-20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="-20" x2="72" y2="-25" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <text x="48" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">TEH</text>
      <text x="48" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">BOTOL</text>
      <circle cx="48" cy="110" r="14" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="48" cy="110" r="5" fill="#FBC02D"/>
    </g>

    <!-- 6. Roma Kelapa Biscuit Box (Far right) -->
    <g transform="translate(440, 230)">
      <rect x="0" y="0" width="85" height="120" rx="6" fill="#F59E0B"/>
      <rect x="8" y="10" width="69" height="40" rx="4" fill="#FFFFFF"/>
      <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#C7462B" text-anchor="middle">Roma</text>
      <text x="42" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#B45309" text-anchor="middle">KELAPA</text>
      <!-- Coconut half -->
      <circle cx="42" cy="80" r="22" fill="#78350F"/>
      <circle cx="42" cy="80" r="17" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Floating Quality Badges -->
  <g filter="url(#cardGlow)">
    <!-- Badge 1: 100% Authentic -->
    <g transform="translate(40, 60)">
      <rect width="145" height="42" rx="21" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="14" fill="#28523C"/>
      <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="84" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#242424">100% Authentic</text>
      <text x="84" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#707070">Direct from Indonesia</text>
    </g>

    <!-- Badge 2: 60+ Pantry Essentials -->
    <g transform="translate(400, 70)">
      <rect width="155" height="42" rx="21" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="14" fill="#C7462B"/>
      <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">★</text>
      <text x="89" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#242424">Over 60+ Items</text>
      <text x="89" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#707070">Fresh Pantry Catalog</text>
    </g>
  </g>
</svg>
